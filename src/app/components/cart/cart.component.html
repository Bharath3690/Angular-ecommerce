<div class="container mx-auto p-4">
  <h2 class="text-3xl font-bold mb-4 text-center">Your Cart</h2>
  <div *ngIf="cartItems.length === 0" class="text-center text-gray-600">
    Your cart is empty.
  </div>
  <div *ngIf="cartItems.length > 0" class="space-y-4">
    <div *ngFor="let item of cartItems" class="flex items-center bg-white p-4 rounded-lg shadow-md">
      <img [src]="item.image" alt="{{ item.title }}" class="w-16 h-16 object-contain mr-4">
      <div class="flex-1">
        <h3 class="text-lg font-semibold">{{ item.title }}</h3>
        <p class="text-gray-600">${{ item.price }} x {{ item.quantity }}</p>
      </div>
      <button (click)="removeFromCart(item)" class="text-red-600 hover:text-red-800">Remove</button>
    </div>
    <div class="text-right">
      <p class="text-xl font-bold">Total: ${{ getTotal() }}</p>
      <button class="mt-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Checkout</button>
    </div>
  </div>
</div>
