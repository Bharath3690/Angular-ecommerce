<p>login works!</p>
<div class="container mx-auto p-4 max-w-md">
  <h2 class="text-3xl font-bold mb-4 text-center">Login</h2>
  <div class="bg-white p-6 rounded-lg shadow-md">
    <div class="mb-4">
      <label class="block text-gray-700">Email</label>
      <input type="email" [(ngModel)]="email" class="w-full p-2 border rounded" required>
    </div>
    <div class="mb-4">
      <label class="block text-gray-700">Password</label>
      <input type="password" [(ngModel)]="password" class="w-full p-2 border rounded" required>
    </div>
    <button (click)="login()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Login</button>
    <p class="mt-2 text-center">Don't have an account? <a routerLink="/signup" class="text-blue-600 hover:underline">Sign Up</a></p>
  </div>
</div>
