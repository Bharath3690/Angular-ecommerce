<div class="container mx-auto p-4">
  <h2 class="text-3xl font-bold mb-4 text-center">Our Products</h2>
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    <div *ngFor="let product of products" class="bg-white p-4 rounded-lg shadow-md hover:shadow-lg transition">
      <img [src]="product.image" alt="{{ product.title }}" class="w-full h-48 object-contain mb-4">
      <h3 class="text-lg font-semibold">{{ product.title }}</h3>
      <p class="text-gray-600">${{ product.price }}</p>
      <p class="text-yellow-500">Rating: {{ product.rating.rate }} ({{ product.rating.count }} reviews)</p>
      <p class="text-gray-500 text-sm">{{ product.description | slice:0:100 }}...</p>
      <button (click)="addToCart(product)" class="mt-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add to Cart</button>
    </div>
  </div>
</div>
